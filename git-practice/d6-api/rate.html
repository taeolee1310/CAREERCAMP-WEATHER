<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원화 환율 계산</title>
<style>
  :root { --bg:#eef3fa; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --line:#d9e0ec; --accent:#2f6fed; --err:#d70015; --chip:#eaf1fe; --edge:var(--line); --ease:cubic-bezier(.23,1,.32,1); }
  :root[data-theme=dark] { --bg:#0b0f17; --card:#161b26; --text:#f5f5f7; --sub:#a1a1a6; --line:#2e3648; --accent:#6ea0ff; --err:#ff6961; --chip:#16233f; color-scheme:dark; }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme=light]) { --bg:#0b0f17; --card:#161b26; --text:#f5f5f7; --sub:#a1a1a6; --line:#2e3648; --accent:#6ea0ff; --err:#ff6961; --chip:#16233f; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 16px 56px; background:var(--bg); color:var(--text);
         font:100%/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:480px; margin:0 auto; }
  h1 { font-size:1.75rem; letter-spacing:-.03em; margin:0 0 .4rem; }
  .lead { color:var(--sub); font-size:.95rem; margin:0 0 1.5rem; }
  .card { background:var(--card); border-radius:18px; padding:1.2rem 1.3rem; margin-bottom:1rem; box-shadow:0 4px 20px rgba(30,50,90,.08); }
  .card h2 { font-size:.8rem; color:var(--sub); margin:0 0 .9rem; }
  label { display:block; font-size:.8rem; color:var(--sub); margin:.8rem 0 .3rem; }
  label:first-of-type { margin-top:0; }
  input, select { width:100%; font:inherit; padding:.65rem .8rem; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; }
  input:focus-visible, select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .result { margin-top:1.1rem; padding:1rem; border-radius:14px; background:var(--chip); }
  .big { font-size:1.9rem; font-weight:700; letter-spacing:-.03em; line-height:1.2; word-break:break-all; }
  .small { color:var(--sub); font-size:.85rem; margin-top:.3rem; }
  .loading { color:var(--sub); }
  .error { color:var(--err); }
  .trend { animation:rise .35s var(--ease) both; }
  .trend .head { display:flex; justify-content:space-between; align-items:baseline; gap:.5rem; flex-wrap:wrap; }
  .trend .now { font-size:1.4rem; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .chart { display:block; width:100%; height:auto; margin-top:.6rem; touch-action:pan-y; cursor:crosshair; }
  .chart .line { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke; }
  .chart .area { fill:var(--accent); opacity:.12; }
  .chart .guide { stroke:var(--line); stroke-width:1; stroke-dasharray:3 4; }
  .chart .dot { fill:var(--accent); stroke:var(--card); stroke-width:2; }
  .range { display:flex; justify-content:space-between; color:var(--sub); font-size:.75rem; margin-top:.2rem; }
  .apibox { background:#10233f; color:#dce6f5; }
  .apibox h2 { color:#9fb6d8; }
  .apibox ul { padding:0; margin:0; }
  .apibox li { list-style:none; margin-bottom:.9rem; }
  .apibox code { display:block; word-break:break-all; font-size:.75rem; margin:.2rem 0 .4rem; color:#fff; }
  .apibox a { color:#8fb8ff; font-size:.85rem; }
  footer { color:var(--sub); font-size:.75rem; text-align:center; margin:1.2rem 0; }
  footer a { color:inherit; }
  main { position:relative; }
  h1 { padding-right:5rem; }
  /* 스위치 토글: 손잡이가 미끄러지며 해/달 쪽으로 이동 */
  .theme { position:absolute; top:0; right:0; width:3.5rem; height:2rem; padding:0; border:1px solid var(--edge); border-radius:999px;
           background:#cfe0fb; cursor:pointer; transition:background .35s var(--ease), transform .12s ease-out; }
  .theme[aria-checked=true] { background:#2c3a5c; }
  .theme:active { transform:scale(.96); }
  .theme:focus-visible { outline:3px solid #2f6fed; outline-offset:2px; }
  .theme .ico { position:absolute; top:50%; transform:translateY(-50%); font-size:.8rem; line-height:1; opacity:.55; }
  .theme .sun { right:.45rem; } .theme .moon { left:.45rem; }
  .theme .knob { position:absolute; top:.17rem; left:.17rem; width:1.5rem; height:1.5rem; border-radius:50%; background:#fff;
                 box-shadow:0 1px 4px rgba(0,0,0,.3); transition:transform .4s cubic-bezier(.34,1.4,.64,1); }
  .theme[aria-checked=true] .knob { transform:translateX(1.5rem); }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes opacity-in { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion:reduce) { .theme, .theme .knob { transition:none; } .trend { animation:opacity-in .2s ease both; } }
</style>
</head>
<body>
<main>
  <button class="theme" id="theme" type="button" role="switch" aria-checked="false" aria-label="다크 모드"><span class="ico moon" aria-hidden="true">🌙</span><span class="ico sun" aria-hidden="true">☀️</span><span class="knob"></span></button>
  <h1>💱 원화로 바꾸기</h1>
  <p class="lead">외화 금액을 넣으면 원(KRW)으로 계산해 드려요.</p>

  <section class="card">
    <h2>계산하기</h2>
    <label for="amount">금액</label>
    <input id="amount" type="number" inputmode="decimal" min="0" step="any" value="100">
    <label for="cur">통화</label>
    <select id="cur">
      <option value="USD">USD · 미국 달러</option>
      <option value="JPY">JPY · 일본 엔</option>
      <option value="EUR">EUR · 유로</option>
      <option value="CNY">CNY · 중국 위안</option>
    </select>
    <div class="result" id="out"><span class="loading">환율을 불러오는 중이에요…</span></div>
  </section>

  <section class="card">
    <h2>📈 최근 30일 추이 (1 <span id="trendCur">USD</span>당 원)</h2>
    <div id="trendBody" class="loading">추이를 불러오는 중이에요…</div>
  </section>

  <footer>환율 데이터: <a href="https://frankfurter.dev/" target="_blank" rel="noopener">Frankfurter</a> · 유럽중앙은행이 하루 한 번 발표하는 기준 환율이에요.</footer>

  <section class="card apibox">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <ul id="apiList"></ul>
  </section>
</main>

<script>
const API = {
  latest: "https://api.frankfurter.dev/v1/latest", // 🔌 환율 (?base=USD&symbols=KRW)
  series: "https://api.frankfurter.dev/v1" // 🔌 30일 추이 (/시작일..?base=USD&symbols=KRW)
};
const LABELS = { latest:"오늘 환율", series:"최근 30일 추이" };

// 실패 이유는 사람이 읽을 수 있게: 영어 오류 문구나 HTTP 번호를 그대로 보여 주지 않는다
const whyFailed = e => /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? " 인터넷 연결을 확인해 주세요."
  : /^HTTP (\d+)/.test(e.message) ? " (서버 오류 " + e.message.slice(5) + ")" : " (" + e.message + ")";

const $ = id => document.getElementById(id);
const fmt = (n, max) => new Intl.NumberFormat("ko-KR", { maximumFractionDigits: max }).format(n);
let rate = null, asOf = "";
const used = {};
let rateRun = 0, trendRun = 0; // 통화를 연달아 바꿔도 옛 응답이 새 화면을 덮지 않게

function renderApiBox() {
  const keys = Object.keys(LABELS), list = $("apiList");
  list.innerHTML = keys.map(k => `<li><b>${LABELS[k]}</b><code></code><a target="_blank" rel="noopener">새 탭에서 원본 JSON 보기 ↗</a></li>`).join("");
  list.querySelectorAll("li").forEach((li, i) => {
    const url = used[keys[i]];
    li.querySelector("code").textContent = url || "아직 부르지 않았어요";
    if (url) li.querySelector("a").href = url; else li.querySelector("a").remove();
  });
}
async function getJSON(key, url) {
  used[key] = url; renderApiBox();
  const res = await fetch(url); // 🔌 API 호출
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// 오늘 날짜는 한국 시간 기준, n일 전 날짜 (YYYY-MM-DD)
function daysAgo(n) {
  const d = new Date(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date()) + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0, 10);
}
const rateFmt = v => fmt(v, v < 100 ? 2 : 1);

function chartSVG(pts) { // pts: [[날짜, 값], ...] 날짜 오름차순
  const W = 600, H = 180, P = 10, n = pts.length;
  const vals = pts.map(p => p[1]), min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const x = i => P + i * (W - 2 * P) / (n - 1);
  const y = v => H - P - (v - min) / span * (H - 2 * P);
  const line = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
  const last = n - 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 30일 환율 추이 그래프">
    <line class="guide" x1="${P}" x2="${W - P}" y1="${y(max)}" y2="${y(max)}"/><line class="guide" x1="${P}" x2="${W - P}" y1="${y(min)}" y2="${y(min)}"/>
    <path class="area" d="${line}L${x(last)} ${H - P}L${x(0)} ${H - P}Z"/><path class="line" d="${line}"/>
    <circle class="dot" id="dot" cx="${x(last)}" cy="${y(vals[last])}" r="5"/></svg>`;
}

async function loadTrend() {
  const my = ++trendRun, el = $("trendBody"), cur = $("cur").value;
  $("trendCur").textContent = cur;
  el.className = "loading"; el.textContent = "추이를 불러오는 중이에요…";
  try {
    const d = await getJSON("series", `${API.series}/${daysAgo(30)}..?base=${cur}&symbols=KRW`);
    if (my !== trendRun) return;
    const pts = Object.keys(d.rates).sort().map(k => [k, d.rates[k].KRW]).filter(p => p[1] != null);
    if (pts.length < 2) throw new Error("데이터가 부족해요");
    const vals = pts.map(p => p[1]), last = pts.length - 1;
    const hi = pts[vals.indexOf(Math.max(...vals))], lo = pts[vals.indexOf(Math.min(...vals))];
    const chg = (vals[last] / vals[0] - 1) * 100;
    el.className = "trend";
    el.innerHTML = `<div class="head"><span class="now" id="tipVal">${rateFmt(vals[last])} 원</span>
        <span class="small" id="tipDate">${pts[last][0]} · ${pts[0][0]} 대비 ${chg >= 0 ? "+" : ""}${chg.toFixed(1)}%</span></div>
      ${chartSVG(pts)}
      <div class="range"><span>${pts[0][0]}</span><span>${pts[last][0]}</span></div>
      <div class="small">최고 ${rateFmt(hi[1])} 원 (${hi[0]}) · 최저 ${rateFmt(lo[1])} 원 (${lo[0]})</div>
      <div class="small">영업일 ${pts.length}일치 · 기준 날짜 ${pts[last][0]} · 유럽중앙은행이 하루 한 번 발표한 값이라 실시간이 아니에요. 그래프를 짚으면 그날 값이 보여요.</div>`;
    const svg = el.querySelector(".chart"), dot = $("dot");
    svg.addEventListener("pointermove", e => { // 마우스·손가락 위치에서 가장 가까운 날을 보여 준다
      const r = svg.getBoundingClientRect(), t = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      const i = Math.round(t * last), W = 600, H = 180, P = 10;
      const mn = Math.min(...vals), sp = (Math.max(...vals) - mn) || 1;
      dot.setAttribute("cx", P + i * (W - 2 * P) / last); dot.setAttribute("cy", H - P - (vals[i] - mn) / sp * (H - 2 * P));
      $("tipVal").textContent = rateFmt(vals[i]) + " 원"; $("tipDate").textContent = pts[i][0];
    });
  } catch (e) {
    if (my !== trendRun) return;
    el.className = "error";
    el.textContent = "⚠️ 추이를 불러오지 못했어요. 잠시 뒤 다시 골라 주세요." + whyFailed(e);
    el.title = e.message;
  }
}

function show() {
  const out = $("out");
  if (rate == null) return;
  const amt = parseFloat($("amount").value), cur = $("cur").value;
  out.className = "result";
  if (isNaN(amt) || amt < 0) { out.innerHTML = '<span class="loading">금액을 입력해 주세요.</span>'; return; }
  out.innerHTML = `<div class="big">${fmt(amt * rate, 0)} 원</div>
    <div class="small">${fmt(amt, 2)} ${cur} · 1 ${cur} = ${fmt(rate, 2)} 원</div>
    <div class="small">기준 날짜 ${asOf} (유럽중앙은행이 하루 한 번 발표한 기준값)</div>`;
}

async function load() {
  const out = $("out"), cur = $("cur").value, my = ++rateRun;
  rate = null; // 새 환율이 오기 전에 금액을 고쳐도 옛 환율로 계산하지 않게
  out.className = "result"; out.innerHTML = '<span class="loading">환율을 불러오는 중이에요…</span>';
  try {
    const d = await getJSON("latest", `${API.latest}?base=${cur}&symbols=KRW`);
    if (my !== rateRun) return;
    rate = d.rates.KRW; asOf = d.date; show();
  } catch (e) {
    if (my !== rateRun) return;
    rate = null;
    out.className = "result error";
    out.textContent = "⚠️ 환율을 불러오지 못했어요. 잠시 뒤 다시 골라 주세요." + whyFailed(e);
    out.title = e.message;
  }
}

$("amount").addEventListener("input", show);
// 오늘 환율 카드와 추이 카드는 따로 부른다: 한쪽이 실패해도 다른 쪽은 보인다
$("cur").addEventListener("change", () => { load(); loadTrend(); });
renderApiBox();
load();
loadTrend();
// 라이트/다크 토글: 고른 값은 기억해 두고, 없으면 기기 설정을 따른다
(function () {
  const root = document.documentElement, btn = document.getElementById("theme");
  const isDark = () => root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  function paint() {
    btn.setAttribute("aria-checked", isDark());
  }
  try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch (e) {}
  btn.onclick = () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    paint();
  };
  paint();
})();
</script>
</body>
</html>
