<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도시 날씨·미세먼지</title>
<style>
  :root { --bg:#eaf1fb; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --err:#d70015; --line:#d9e2f1; --chip:#f2f6fc; --accent:#2f6fed;
          --ease:cubic-bezier(.23,1,.32,1); --edge:var(--line); }
  :root[data-theme=dark] { --bg:#0b0f17; --card:#161b26; --text:#f5f5f7; --sub:#a1a1a6; --err:#ff6961; --line:#2e3648; --chip:#1d2433; --accent:#3b6fe0; color-scheme:dark; }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme=light]) { --bg:#0b0f17; --card:#161b26; --text:#f5f5f7; --sub:#a1a1a6; --err:#ff6961; --line:#2e3648; --chip:#1d2433; --accent:#3b6fe0; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 16px 56px; color:var(--text); min-height:100vh; background:var(--bg);
         font:100%/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:clamp(1.75rem,5vw,2.5rem); line-height:1.1; letter-spacing:-.03em; margin:0 0 .4rem; }
  .lead { color:var(--sub); font-size:.95rem; margin:0 0 1.5rem; }
  form { display:flex; gap:.5rem; margin-bottom:1rem; }
  input { flex:1; min-width:0; font:inherit; font-size:1rem; padding:.7rem 1rem; border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); }
  input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button { font:inherit; font-weight:600; padding:.7rem 1.2rem; border:0; border-radius:14px; background:var(--accent); color:#fff; cursor:pointer;
           min-height:44px; transition:transform .12s ease-out; }
  button:active { transform:scale(.97); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:1.25rem 1.4rem; margin-bottom:1rem; }
  .card h2 { font-size:.8rem; margin:0 0 .9rem; color:var(--sub); font-weight:600; letter-spacing:.04em; }
  .loading { color:var(--sub); animation:pulse 1.4s ease-in-out infinite; }
  .error { color:var(--err); }
  .idle { color:var(--sub); }
  .body > .in { animation:rise .35s var(--ease) both; }
  .temp { font-size:3.5rem; line-height:1; font-weight:700; letter-spacing:-.04em; }
  .icon { font-size:3rem; line-height:1; }
  .row { display:flex; align-items:center; gap:1rem; }
  .desc { color:var(--sub); font-size:.9rem; margin-top:.4rem; }
  .dust { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
  .dust > div { background:var(--chip); border-radius:16px; padding:.9rem 1rem; }
  .dust small { color:var(--sub); display:block; font-size:.78rem; }
  .dust b { font-size:1.8rem; letter-spacing:-.02em; }
  .dust .unit { color:var(--sub); font-size:.8rem; margin-left:.2rem; }
  .grade { display:inline-block; margin-top:.35rem; padding:.15rem .7rem; border-radius:999px; font-size:.85rem; font-weight:700; color:#fff; }
  .g0 { background:#1e6fe0; } .g1 { background:#1a8f4a; } .g2 { background:#c26a00; } .g3 { background:#d70015; }
  .meta { color:var(--sub); font-size:.75rem; margin-top:.8rem; }
  .apibox { background:#10233f; border-color:#10233f; color:#dce6f5; }
  .apibox h2 { color:#9fb6d8; }
  .apibox ul { padding:0; margin:0; }
  .apibox li { list-style:none; margin-bottom:.9rem; }
  .apibox code { display:block; word-break:break-all; font-size:.75rem; margin:.2rem 0 .3rem; color:#fff; }
  .apibox a { color:#8fb8ff; font-size:.8rem; }
  .apibox .meta { color:#9fb6d8; }
  footer { color:var(--sub); font-size:.75rem; text-align:center; margin-top:1.5rem; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes pulse { 50% { opacity:.45; } }
  @keyframes opacity-in { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion:reduce) {
    .body > .in { animation:opacity-in .2s ease both; }
    .loading { animation:none; }
    button { transition:none; }
  }
  main { position:relative; }
  h1 { padding-right:5rem; }
  /* 스위치 토글: 손잡이가 미끄러지며 해/달 쪽으로 이동 */
  .theme { position:absolute; top:0; right:0; width:3.5rem; height:2rem; padding:0; border:1px solid var(--edge); border-radius:999px;
           background:#cfe0fb; cursor:pointer; transition:background .35s var(--ease), transform .12s ease-out; }
  .theme[aria-checked=true] { background:#2c3a5c; }
  .theme:active { transform:scale(.96); }
  .theme:focus-visible { outline:3px solid #2f6fed; outline-offset:2px; }
  .theme .ico { position:absolute; top:50%; transform:translateY(-50%); font-size:.8rem; line-height:1; opacity:.55; }
  .theme .sun { right:.45rem; } .theme .moon { left:.45rem; }
  .theme .knob { position:absolute; top:.17rem; left:.17rem; width:1.5rem; height:1.5rem; border-radius:50%; background:#fff;
                 box-shadow:0 1px 4px rgba(0,0,0,.3); transition:transform .4s cubic-bezier(.34,1.4,.64,1); }
  .theme[aria-checked=true] .knob { transform:translateX(1.5rem); }
  @media (prefers-reduced-motion:reduce) { .theme, .theme .knob { transition:none; } }
</style>
</head>
<body>
<main>
  <button class="theme" id="theme" type="button" role="switch" aria-checked="false" aria-label="다크 모드"><span class="ico moon" aria-hidden="true">🌙</span><span class="ico sun" aria-hidden="true">☀️</span><span class="knob"></span></button>
  <h1>🏙️ 도시 날씨·미세먼지</h1>
  <p class="lead">도시 이름을 넣으면 위치를 찾고, 그 위치의 기온과 미세먼지를 보여 줘요.</p>

  <form id="form">
    <input id="q" type="search" value="Seoul" placeholder="도시 이름 (예: Busan, Tokyo, 서울특별시)" aria-label="도시 이름" autocomplete="off">
    <button type="submit">검색</button>
  </form>

  <section class="card">
    <h2>① 찾은 도시</h2>
    <div id="geoBody" class="body"></div>
  </section>

  <section class="card">
    <h2>② 지금 기온</h2>
    <div id="wxBody" class="body"></div>
  </section>

  <section class="card">
    <h2>③ 미세먼지 (환경부 기준 등급)</h2>
    <div id="airBody" class="body"></div>
  </section>

  <section class="card apibox">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <ul id="apiList"></ul>
    <div class="meta">① 응답의 latitude·longitude가 ②·③ 주소에 그대로 들어가요. 도시를 바꾸면 아래 주소의 숫자가 바뀌어요.</div>
  </section>

  <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener" style="color:inherit">Open-Meteo.com</a> · 지오코딩·대기질 모두 Open-Meteo 제공</footer>
</main>

<script>
const API = {
  geo: name => "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) + "&count=10&language=ko&format=json", // 🔌 1번: 도시 이름 → 위도·경도
  wx:  (lat, lon) => "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,apparent_temperature,weather_code&timezone=auto", // 🔌 2번: 날씨
  air: (lat, lon) => "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=" + lat + "&longitude=" + lon + "&current=pm10,pm2_5&timezone=auto" // 🔌 3번: 미세먼지
};

const WEATHER = {
  0:["☀️","맑음"],1:["🌤️","대체로 맑음"],2:["⛅","구름 조금"],3:["☁️","흐림"],
  45:["🌫️","안개"],48:["🌫️","안개"],51:["🌦️","가벼운 이슬비"],53:["🌦️","이슬비"],55:["🌦️","강한 이슬비"],
  61:["🌧️","약한 비"],63:["🌧️","비"],65:["🌧️","강한 비"],71:["🌨️","약한 눈"],73:["🌨️","눈"],75:["❄️","강한 눈"],
  80:["🌦️","소나기"],81:["🌦️","소나기"],82:["⛈️","강한 소나기"],95:["⛈️","뇌우"],96:["⛈️","뇌우"],99:["⛈️","뇌우"]
};
const wx = c => WEATHER[c] || ["🌡️","알 수 없음"];

// 환경부 4단계 (µg/m³): [좋음 상한, 보통 상한, 나쁨 상한] 초과하면 매우 나쁨
const GRADES = ["좋음","보통","나쁨","매우 나쁨"];
const LIMITS = { pm10:[30,80,150], pm2_5:[15,35,75] };
const grade = (kind, v) => { const i = LIMITS[kind].findIndex(max => Math.round(v) <= max); return i < 0 ? 3 : i; };

const $ = id => document.getElementById(id);
const used = {}; // 실제로 부른 주소 (API 상자에 표시)
let runId = 0;   // 검색을 연속으로 눌렀을 때 옛 응답이 새 화면을 덮지 않게

function show(el, cls, html) { el.className = "body " + cls; el.innerHTML = html; }
function loading(el) { show(el, "loading", "불러오는 중…"); }
// 실패 이유는 사람이 읽을 수 있게: 영어 오류 문구나 HTTP 번호를 그대로 보여 주지 않는다
const whyFailed = e => /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? " 인터넷 연결을 확인해 주세요."
  : /^HTTP (\d+)/.test(e.message) ? " (서버 오류 " + e.message.slice(5) + ")" : " (" + e.message + ")";
function fail(el, e) {
  show(el, "error", "");
  el.textContent = "⚠️ " + (e.friendly ? e.message : "불러오지 못했어요. 잠시 뒤 다시 검색해 주세요." + whyFailed(e));
}
async function getJSON(key, url) {
  used[key] = url;
  renderApiBox();
  const res = await fetch(url); // 🔌 API 호출
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function renderApiBox() {
  const labels = { geo:"① 도시 찾기", wx:"② 날씨", air:"③ 미세먼지" };
  const list = $("apiList");
  list.innerHTML = Object.keys(labels).map(k =>
    `<li><b>${labels[k]}</b><code></code><a target="_blank" rel="noopener">새 탭에서 원본 JSON 보기 ↗</a></li>`).join("");
  list.querySelectorAll("li").forEach((li, i) => {
    const url = used[Object.keys(labels)[i]];
    li.querySelector("code").textContent = url || "아직 부르지 않았어요";
    if (url) li.querySelector("a").href = url; else li.querySelector("a").remove();
  });
}

function dustCell(label, kind, v) {
  if (v == null) return `<div><small>${label}</small><b>-</b><br><span class="meta">측정값 없음</span></div>`;
  const g = grade(kind, v);
  return `<div><small>${label}</small><b>${Math.round(v)}</b><span class="unit">µg/m³</span><br><span class="grade g${g}">${GRADES[g]}</span></div>`;
}

async function search(name) {
  const my = ++runId;
  const geoEl = $("geoBody"), wxEl = $("wxBody"), airEl = $("airBody");
  Object.keys(used).forEach(k => delete used[k]);
  [geoEl, wxEl, airEl].forEach(loading);

  // 1번: 이름 → 좌표. 실패하면 2·3번은 부를 수 없다
  let place;
  try {
    const g = await getJSON("geo", API.geo(name));
    if (my !== runId) return;
    if (!g.results || !g.results.length) { const err = new Error("도시를 못 찾았어요. 영어 이름(Seoul)이나 정식 이름(서울특별시)으로 검색해 보세요."); err.friendly = true; throw err; }
    place = g.results.reduce((a, b) => (b.population || 0) > (a.population || 0) ? b : a); // 같은 이름이 여러 곳이면 인구가 가장 많은 곳
  } catch (e) {
    if (my !== runId) return;
    fail(geoEl, e);
    show(wxEl, "idle", "도시를 먼저 찾아야 볼 수 있어요.");
    show(airEl, "idle", "도시를 먼저 찾아야 볼 수 있어요.");
    renderApiBox();
    return;
  }
  const { latitude: lat, longitude: lon } = place;
  show(geoEl, "", `<div class="in"><b>${[place.name, place.admin1, place.country].filter(Boolean).join(", ").replace(/[<>&]/g, "")}</b>
    <div class="meta">위도 ${lat} · 경도 ${lon}</div></div>`);

  // 2·3번은 서로 독립: 하나가 실패해도 다른 카드는 보인다
  await Promise.all([
    getJSON("wx", API.wx(lat, lon)).then(d => {
      if (my !== runId) return;
      const c = d.current, [icon, text] = wx(c.weather_code);
      show(wxEl, "", `<div class="in row"><div class="icon">${icon}</div><div>
        <div class="temp">${Math.round(c.temperature_2m)}°C</div>
        <div class="desc">${text} · 체감 ${Math.round(c.apparent_temperature)}°C</div></div></div>
        <div class="meta">기준 시각: ${c.time.replace("T"," ")} (현지 시간)</div>`);
    }).catch(e => { if (my === runId) fail(wxEl, e); }),

    getJSON("air", API.air(lat, lon)).then(d => {
      if (my !== runId) return;
      const c = d.current;
      show(airEl, "", `<div class="in dust">${dustCell("미세먼지 PM10", "pm10", c.pm10)}${dustCell("초미세먼지 PM2.5", "pm2_5", c.pm2_5)}</div>
        <div class="meta">기준 시각: ${c.time.replace("T"," ")} (현지 시간)<br>
        환경부 등급은 하루 평균 기준이에요. 여기서는 지금 값(모델 추정)에 맞춰 본 거라 에어코리아 발표와 다를 수 있어요.<br>
        PM10: 좋음 0~30 · 보통 31~80 · 나쁨 81~150 · 매우 나쁨 151~ / PM2.5: 좋음 0~15 · 보통 16~35 · 나쁨 36~75 · 매우 나쁨 76~</div>`);
    }).catch(e => { if (my === runId) fail(airEl, e); })
  ]);
  if (my === runId) renderApiBox();
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("q").value.trim();
  if (name) search(name);
});
renderApiBox();
search($("q").value);
// 라이트/다크 토글: 고른 값은 기억해 두고, 없으면 기기 설정을 따른다
(function () {
  const root = document.documentElement, btn = document.getElementById("theme");
  const isDark = () => root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  function paint() {
    btn.setAttribute("aria-checked", isDark());
  }
  try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch (e) {}
  btn.onclick = () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    paint();
  };
  paint();
})();
</script>
</body>
</html>
